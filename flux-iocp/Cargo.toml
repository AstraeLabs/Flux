[package]
name    = "flux-iocp"
version = "0.0.1"
edition = "2024"
description = "Windows overlapped-I/O (IOCP) positional file reads, behind a safe API. All unsafe FFI lives here so flux itself can keep #![forbid(unsafe_code)]."

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
