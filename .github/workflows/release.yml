name: Build & Update Binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # ── Windows
          - target:     x86_64-pc-windows-msvc
            os:         windows-latest
            artifact:   flux.exe
            asset_name: flux-win-x64.exe

          - target:     aarch64-pc-windows-msvc
            os:         windows-latest
            artifact:   flux.exe
            asset_name: flux-win-arm64.exe

          # ── macOS
          - target:     x86_64-apple-darwin
            os:         macos-latest
            artifact:   flux
            asset_name: flux-osx-x64

          - target:     aarch64-apple-darwin
            os:         macos-latest
            artifact:   flux
            asset_name: flux-osx-arm64

          # ── Linux (glibc – dynamically linked)
          - target:     x86_64-unknown-linux-gnu
            os:         ubuntu-22.04
            artifact:   flux
            asset_name: flux-linux-x64

          - target:     aarch64-unknown-linux-gnu
            os:         ubuntu-latest
            artifact:   flux
            asset_name: flux-linux-arm64
            cross:      true

          # ── Linux (musl – fully static binary)
          - target:     x86_64-unknown-linux-musl
            os:         ubuntu-latest
            artifact:   flux
            asset_name: flux-linux-musl-x64
            cross:      true

          # ── Android / Termux
          - target:     aarch64-linux-android
            os:         ubuntu-latest
            artifact:   flux
            asset_name: flux-termux-arm64
            cross:      true

          - target:     armv7-linux-androideabi
            os:         ubuntu-latest
            artifact:   flux
            asset_name: flux-termux-arm
            cross:      true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install target for pinned toolchain
        if: matrix.cross != true
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cargo)
        if: matrix.cross != true
        shell: bash
        run: |
          cargo build --release -p flux --all-features --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        shell: bash
        run: |
          cross build --release -p flux --all-features --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          dst="dist/${{ matrix.asset_name }}"
          cp "$src" "$dst"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 1

  update-release:
    name: Update release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List built binaries
        run: ls -lh dist/

      - name: Upload / overwrite release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Init
          files: dist/*
          fail_on_unmatched_files: true
