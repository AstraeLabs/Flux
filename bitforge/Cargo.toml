[package]
name    = "bitforge"
version = "0.0.1"
edition = "2024"

[features]
default = ["std"]
std = ["chrono?/std", "chrono?/clock"]
chrono = ["dep:chrono"]
serde = ["dep:serde"]

[dependencies]
chrono = { version = "0.4", optional = true, default-features = false, features = ["alloc"] }
libm = "0.2"
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }